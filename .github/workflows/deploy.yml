name: Deploy Pipeline - AT Questão 12

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package --file "Microsserviços e DevOps com Spring Boot e Spring Cloud [24E3_3]/AT/questao-12/pom.xml"
        
      - name: Fazer login no Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build da imagem Docker
        run: docker build -t torresm/at-questao-12:${{ github.sha }} "Microsserviços e DevOps com Spring Boot e Spring Cloud [24E3_3]/AT/questao-12"

      - name: Push da imagem para Docker Hub
        run: docker push torresm/at-questao-12:${{ github.sha }}

