spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=questao-01
spring.cloud.gateway.routes[0].uri=lb://QUESTAO-01
spring.cloud.gateway.routes[0].predicates[0]=Path=/questao-01/**

spring.cloud.gateway.routes[1].id=questao-02
spring.cloud.gateway.routes[1].uri=lb://QUESTAO-02
